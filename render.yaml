services:
  - type: web
    name: rolefit
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "true"
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FILE_TOKEN_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_UPLOAD_DIR
        value: uploads
      - key: SEED_ON_EMPTY
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
