services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - rolefit_mongo:/data/db
    ports:
      - "27017:27017"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/ats
      CLIENT_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      JWT_EXPIRES_IN: 7d
      STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: uploads
      FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET:-change-file-token-secret}
      MAX_RESUME_SIZE_MB: 5
      AI_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEND_REJECTION_EMAILS: "false"
    volumes:
      - rolefit_uploads:/app/uploads
    ports:
      - "5000:5000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  rolefit_mongo:
  rolefit_uploads:
