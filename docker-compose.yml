services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - rolefit_mongo:/data/db
    ports:
      - "27017:27017"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      SERVE_CLIENT: "true"
      MONGODB_URI: mongodb://mongo:27017/ats
      CLIENT_URL: http://localhost:5000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-openssl-rand}
      FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET:-change-file-token-secret-use-openssl-rand}
      STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: uploads
      SEED_ON_EMPTY: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEND_REJECTION_EMAILS: "false"
    volumes:
      - rolefit_uploads:/app/uploads
    ports:
      - "5000:5000"

volumes:
  rolefit_mongo:
  rolefit_uploads:
